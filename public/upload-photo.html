<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo - EnviroTrack</title>
    <link rel="icon" href="">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Reserved space for user's header and icon -->
    <div class="reserved-header"></div>

    <!-- Main tagline header matching the login page -->
    <h1>Where campus tidiness meets ease of use</h1>

    <!-- Horizontal Navigation Menu -->
    <nav class="horizontal-nav">
        <a href="dashboard.html" class="nav-btn">Home</a>
        <a href="upload-photo.html" class="nav-btn active">Upload a photo</a>
        <a href="pictures.html" class="nav-btn">Your pictures</a>
        <a href="rewards.html" class="nav-btn">Rewards</a>
        <a href="contact.html" class="nav-btn">Contact us</a>
    </nav>

    <!-- Centered Container -->
    <main class="dashboard-container">
        <div class="dashboard-island">
            <h2 class="welcome-title">Upload Photo</h2>
            <p class="subtitle">Report campus environmental updates by uploading an image</p>

            <form id="uploadForm" class="subpage-form" onsubmit="event.preventDefault(); alert('Photo uploaded successfully! (Simulation)');">
                <div class="form-group">
                    <label for="photoFile">Choose File</label>
                    <input type="file" id="photoFile" accept="image/*" required class="glass-input">
                </div>
                
                <div class="form-group">
                    <label for="location">Location / Details</label>
                    <input type="text" id="location" placeholder="e.g., Main quad green space" required class="glass-input">
                </div>
                
                <div class="form-group">
                    <label for="notes">Description</label>
                    <textarea id="notes" placeholder="Describe the issue or update..." rows="3" class="glass-input"></textarea>
                </div>

                <button type="submit" class="submit-action-btn">Submit Photo</button>
            </form>
        </div>
    </main>

    <!-- Firebase App & Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
