<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Pictures - EnviroTrack</title>
    <link rel="icon" href="">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Reserved space for user's header and icon -->
    <div class="reserved-header"></div>

    <!-- Main tagline header matching the login page -->
    <h1>Where campus tidiness meets ease of use</h1>

    <!-- Horizontal Navigation Menu -->
    <nav class="horizontal-nav">
        <a href="dashboard.html" class="nav-btn">Home</a>
        <a href="upload-photo.html" class="nav-btn">Upload a photo</a>
        <a href="pictures.html" class="nav-btn active">Your pictures</a>
        <a href="rewards.html" class="nav-btn">Rewards</a>
        <a href="contact.html" class="nav-btn">Contact us</a>
    </nav>

    <!-- Centered Container -->
    <main class="dashboard-container">
        <div class="dashboard-island wide-island">
            <h2 class="welcome-title">Your Pictures</h2>
            <p class="subtitle">History of your reported campus environmental updates</p>

            <div class="gallery-grid">
                <!-- Gallery Item 1 -->
                <div class="gallery-item">
                    <div class="gallery-img-wrapper">
                        <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=300&h=200&q=80" alt="Recycling center">
                    </div>
                    <div class="gallery-details">
                        <h4>Recycling bins sorting bin</h4>
                        <p class="location">📍 Science Block Yard</p>
                        <span class="status-badge verified">Verified</span>
                    </div>
                </div>

                <!-- Gallery Item 2 -->
                <div class="gallery-item">
                    <div class="gallery-img-wrapper">
                        <img src="https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?auto=format&fit=crop&w=300&h=200&q=80" alt="Campus litter bin">
                    </div>
                    <div class="gallery-details">
                        <h4>Overflowing container reported</h4>
                        <p class="location">📍 Library South Wall</p>
                        <span class="status-badge review">Under Review</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase App & Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
