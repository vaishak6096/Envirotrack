<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: #ffffff;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 40px 36px 36px 36px;
            text-align: center;
        }
        .google-logo {
            height: 24px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            line-height: 1.33;
            margin-bottom: 8px;
        }
        p.subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 24px;
        }
        .account-list {
            margin-bottom: 24px;
            border-top: 1px solid #dadce0;
            border-bottom: 1px solid #dadce0;
        }
        .account-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s ease;
            border-bottom: 1px solid #f1f3f4;
        }
        .account-item:last-child {
            border-bottom: none;
        }
        .account-item:hover {
            background: #f8f9fa;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin-right: 12px;
            background: #e8eaed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 500;
            color: #1a73e8;
            overflow: hidden;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info {
            flex: 1;
        }
        .name {
            font-size: 14px;
            font-weight: 500;
            color: #3c4043;
        }
        .email {
            font-size: 12px;
            color: #5f6368;
            margin-top: 2px;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #5f6368;
            margin-top: 32px;
        }
        .footer a {
            color: #1a73e8;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="google-logo" viewBox="0 0 74 24" width="74" height="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-6.887 4.114-4.907 0-8.905-3.998-8.905-8.905s3.998-8.905 8.905-8.905c2.492 0 4.545.986 6.096 2.477l3.003-3.003C18.665 1.542 15.65 0 12.24 0c-6.76 0-12.24 5.48-12.24 12.24s5.48 12.24 12.24 12.24c6.3 0 11.238-4.5 11.238-11.238 0-.742-.075-1.455-.225-2.185H12.24z" fill="#4285F4"/>
            <path d="M30.4 12.24c0 3.86-2.85 6.74-6.6 6.74s-6.6-2.88-6.6-6.74c0-3.86 2.85-6.74 6.6-6.74s6.6 2.88 6.6 6.74zm-3.2 0c0-2.45-1.74-4.06-3.4-4.06s-3.4 1.61-3.4 4.06 1.74 4.06 3.4 4.06 3.4-1.61 3.4-4.06z" fill="#EA4335"/>
            <path d="M44.4 12.24c0 3.86-2.85 6.74-6.6 6.74s-6.6-2.88-6.6-6.74c0-3.86 2.85-6.74 6.6-6.74s6.6 2.88 6.6 6.74zm-3.2 0c0-2.45-1.74-4.06-3.4-4.06s-3.4 1.61-3.4 4.06 1.74 4.06 3.4 4.06 3.4-1.61 3.4-4.06z" fill="#FBBC05"/>
            <path d="M57.8 6.04v11.83c0 4.88-2.87 6.87-6.26 6.87-3.23 0-5.17-2.17-5.91-3.95l2.79-1.16c.5 1.19 1.72 2.61 3.12 2.61 1.93 0 3.12-1.2 3.12-3.44v-1.06h-.11c-.59.73-1.73 1.39-3.17 1.39-3.03 0-5.78-2.61-5.78-6.69 0-4.11 2.75-6.73 5.78-6.73 1.44 0 2.58.64 3.17 1.35h.11V6.04h3.08zm-2.92 6.24c0-2.41-1.72-4.02-3.32-4.02-1.61 0-2.99 1.61-2.99 4.02s1.38 4.02 2.99 4.02c1.6 0 3.32-1.61 3.32-4.02z" fill="#4285F4"/>
            <path d="M60.6 1v22.48h3.12V1H60.6z" fill="#34A853"/>
            <path d="M73.8 14.6l2.5 1.66c-.8 1.2-2.73 3.47-6.23 3.47-4.24 0-7.37-3.27-7.37-6.73 0-3.9 3.15-6.74 7.02-6.74 3.98 0 5.86 2.87 6.49 4.29l.34.86-9.67 4c.75 1.48 1.91 2.22 3.58 2.22 1.66 0 2.77-.82 3.34-1.98zm-7.61-2.52l6.47-2.68c-.37-.93-1.46-1.59-2.72-1.59-1.62 0-3.83 1.46-3.75 4.27z" fill="#EA4335"/>
        </svg>
        <h1>Choose an account</h1>
        <p class="subtitle">to continue to <strong>EnviroTrack</strong></p>
        
        <div class="account-list">
            <!-- Account 1 -->
            <div class="account-item" onclick="selectAccount('Eco Explorer', 'eco.explorer@envirotrack.io', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&h=150&q=80')">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&h=150&q=80" alt="Eco Explorer">
                </div>
                <div class="info">
                    <div class="name">Eco Explorer</div>
                    <div class="email">eco.explorer@envirotrack.io</div>
                </div>
            </div>
            
            <!-- Account 2 -->
            <div class="account-item" onclick="selectAccount('Carbon Tracker', 'carbon.tracker@envirotrack.io', 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&h=150&q=80')">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&h=150&q=80" alt="Carbon Tracker">
                </div>
                <div class="info">
                    <div class="name">Carbon Tracker</div>
                    <div class="email">carbon.tracker@envirotrack.io</div>
                </div>
            </div>
            
            <!-- Account 3 -->
            <div class="account-item" onclick="selectAccount('Jane Doe', 'jane.doe@gmail.com', '')">
                <div class="avatar">JD</div>
                <div class="info">
                    <div class="name">Jane Doe</div>
                    <div class="email">jane.doe@gmail.com</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <span>English (United States)</span>
            <div>
                <a href="#" style="margin-right: 16px;">Help</a>
                <a href="#" style="margin-right: 16px;">Privacy</a>
                <a href="#">Terms</a>
            </div>
        </div>
    </div>

    <script>
        function selectAccount(name, email, photoUrl) {
            // Generate a fake firebase uid and token
            const payload = {
                type: 'MOCK_OAUTH_SUCCESS',
                user: {
                    uid: 'mock_uid_' + Math.random().toString(36).substr(2, 9),
                    name: name,
                    email: email,
                    photoURL: photoUrl || `https://api.dicebear.com/7.x/initials/svg?seed=${name}`
                },
                idToken: 'mock_firebase_id_token_' + btoa(JSON.stringify({ name, email }))
            };
            
            if (window.opener) {
                window.opener.postMessage(payload, window.location.origin);
                window.close();
            } else {
                alert('No parent window found to send credentials.');
            }
        }
    </script>
</body>
</html>
